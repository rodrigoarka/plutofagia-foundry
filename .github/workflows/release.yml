name: Publicar a próxima versão do Foundry
# Execute manualmente após sincronizar o código-fonte no repositório.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar fonte e manifesto
        run: |
          python3 - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path('system.json').read_text())
          assert m['id']=='plutofagia'
          for path in m['esmodules']+m['styles']:
              assert pathlib.Path(path).is_file(),path
          print('Pronto para empacotar',m['version'])
          PY
          node --test tests/*.mjs
      - name: Empacotar o sistema
        run: |
          zip -qr plutofagia.zip system.json module templates styles assets lang tests README.md LICENSE.txt
      - name: Publicar nova Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('system.json'))['version'])")"
          TAG="v$VERSION"
          gh release create "$TAG" plutofagia.zip system.json --target "${{ github.sha }}" --title "PLUTOFAGIA $TAG" --notes "Sistema Foundry VTT 13. Atualização disponível pelo manifesto."
